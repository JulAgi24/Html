<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="Julian_Agius" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>User_Review_Amsterdam</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="body">
    <div class="masthead_div">
      <div><img src="Flag.png" class="Flag" /></div>
      <div style="width: fit-content; margin: auto; display: flex">
        <div class="masthead-item masthead">
          <a class="masthead_text" href="homepage.html"> Home Page </a>
        </div>
        <div class="masthead-item masthead">
          <a class="masthead_text" href="user_review.html"> User Review </a>
        </div>
        <div class="masthead-item masthead">
          <a class="masthead_text" href="attractions.html"> Attractions </a>
        </div>
        <div class="masthead-item masthead">
          <a class="masthead_text" href="famouspeople.html">
            Famous Inhabitants
          </a>
        </div>
      </div>
      <div><img src="Flag.png" class="Flag" /></div>
    </div>

    <div class="masthead-phone">
      <input type="checkbox" id="toggle" style="display: none" />
      <label for="toggle" class="image">
        <img src="Menus.png" class="image-drop-down" />
      </label>

      <div class="text-container drop-phone-text">
        <a class="drop-down-text" href="homepage.html"> Home Page </a>
        <a class="drop-down-text" href="user_review.html"> User Review </a>
        <a class="drop-down-text" href="attractions.html"> Attractions </a>
        <a class="drop-down-text" href="famouspeople.html">
          Famous Inhabitants</a
        >
      </div>
    </div>

    <div class="title-user"><p>Contact Us</p></div>

    <div class="user_form">
      <form action="/submit" name="inputform" method="post">
        <h2 class="form_header">Full Name <span class="user_red"> *</span></h2>
        <div style="display: flex">
          <input
            name="name"
            class="font user_form_text user_form_text_right"
            type="text"
          />
          <input
            name="surname"
            class="font user_form_text user_form_text_left"
            type="text"
          />
        </div>
        <br />
        <br />
        <h2 class="form_header">Review <span class="user_red"> *</span></h2>
        <textarea
          id="review_text_area"
          name="review"
          class="font user_textarea"
          name="reviewinput"
        ></textarea>
        <br />
        <br />
        <h2 class="form_header">Date <span class="user_red"> *</span></h2>
        <input
          id="dates"
          name="date"
          class="font user_date"
          type="datetime-local"
          readonly
        />
        <br />
        <br />
        <input class="font user_input" type="submit" value="submit" />
      </form>
    </div>
    <script type="text/JavaScript" src="Time.js"></script>

    <div id="review"></div>
    <div class="page-select page-back" id="pagination"></div>
    <script type="text/JavaScript" src="review.js"></script>
  </body>
</html>
