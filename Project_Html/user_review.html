<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="Julian_Agius" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>User_Review_Amsterdam</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="body">
    <div class="masthead_div">
      <div><img src="Flag.png" class="Flag" /></div>
      <div style="width: fit-content; margin: auto; display: flex">
        <div class="masthead-item masthead">
          <a class="masthead_text" href="HomePage.html"> Home Page </a>
        </div>
        <div class="masthead-item masthead">
          <a class="masthead_text" href="user_review.html"> User Review </a>
        </div>
        <div class="masthead-item masthead">
          <a class="masthead_text" href="attractions.html"> Attractions </a>
        </div>
        <div class="masthead-item masthead">
          <a class="masthead_text" href="famouspeople.html">
            Famous Inhabitants
          </a>
        </div>
      </div>
      <div><img src="Flag.png" class="Flag" /></div>
    </div>

    <div class="userform_middle">
      <form name="inputform" method="get" class="userform_interior">
        <p class="title user_title"><b>Contact Us</b></p>
        <h2 class="form_header">Full Name <span class="user_red"> *</span></h2>
        <div style="display: flex">
          <input class="user_form_text user_form_text_right" type="text" />
          <input class="user_form_text user_form_text_left" type="text" />
        </div>
        <br />
        <br />
        <h2 class="form_header">Review <span class="user_red"> *</span></h2>
        <textarea class="user_textarea" name="reviewinput"></textarea>
        <br />
        <br />
        <h2 class="form_header">Date <span class="user_red"> *</span></h2>
        <input class="user_date" type="date" />
        <br />
        <br />
        <h2 class="form_header">Time<span class="user_red"> *</span></h2>
        <input class="user_date" type="time">
        <br />
        <br />
        <input class="user_input" type="submit" value="submit" />
      </form>
    </div>
  </body>
</html>
